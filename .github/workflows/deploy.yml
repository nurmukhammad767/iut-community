name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      airflow: ${{ steps.changes.outputs.airflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        uses: tj-actions/changed-files@v42
        with:
          files_yaml: |
            backend:
              - 'server/auth/**'
              - 'server/db_config.py'
              - 'server/docker-compose.yaml'
            frontend:
              - 'frontend/src/**'
              - 'frontend/vite.config.ts'
              - 'frontend/package.json'
            airflow:
              - 'server/timetable_web_scraping/**'
              - 'server/db/**'

  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Exit immediately if any command fails
            set -e

            # 2. Navigate to project folder
            cd /root/iut-community

            # 3. Fast git update with shallow fetch
            git fetch origin main --depth=1
            git reset --hard origin/main

            # 4. Re-create the .env file
            cat > server/.env << EOF
            AIRFLOW_UID=1000
            FERNET_KEY=${{ secrets.FERNET_KEY }}
            AIRFLOW_PROJ_DIR=./timetable_web_scraping
            _AIRFLOW_WWW_USER_USERNAME=admin
            _AIRFLOW_WWW_USER_PASSWORD=${{ secrets.AIRFLOW_WWW_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            # 5. Build and Restart Services
            cd server

            # Enable BuildKit for better caching and parallel builds
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Only pull images that are used (not all images)
            sudo docker compose pull --no-parallel 2>/dev/null || true

            # Smart rebuild: only rebuild changed services
            SERVICES_TO_BUILD=""
            
            # Check which services changed
            if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
              SERVICES_TO_BUILD="$SERVICES_TO_BUILD backend"
            fi
            
            if [ "${{ needs.detect-changes.outputs.airflow }}" = "true" ]; then
              SERVICES_TO_BUILD="$SERVICES_TO_BUILD airflow-webserver airflow-scheduler"
            fi
            
            # If nothing changed, just restart containers without rebuilding
            if [ -z "$SERVICES_TO_BUILD" ]; then
              echo "No backend/airflow changes detected. Restarting services..."
              sudo docker compose up -d
            else
              echo "Building services: $SERVICES_TO_BUILD"
              # Build only changed services
              sudo docker compose build --parallel $SERVICES_TO_BUILD
              sudo docker compose up -d $SERVICES_TO_BUILD
              echo "Restarting dependent services..."
              sudo docker compose up -d
            fi

            # 6. Aggressive cleanup (remove unused images)
            sudo docker image prune -af --filter "until=24h" || true
            sudo docker container prune -f || true