name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # -------------------------------------------------------
            # 1. Pull latest code
            # -------------------------------------------------------
            cd /root/iut-community
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Code updated"

            # -------------------------------------------------------
            # 2. Create .env ONLY if it doesn't exist
            # -------------------------------------------------------
            if [ ! -f server/.env ]; then
              echo "📝 .env not found — creating for the first time..."
              cat > server/.env << EOF
            AIRFLOW_UID=1000
            FERNET_KEY=${{ secrets.FERNET_KEY }}
            AIRFLOW_PROJ_DIR=./timetable_web_scraping
            _AIRFLOW_WWW_USER_USERNAME=admin
            _AIRFLOW_WWW_USER_PASSWORD=${{ secrets.AIRFLOW_WWW_PASSWORD }}
            DB_HOST=backend-postgres
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@backend-postgres:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
            EOF
              echo "✅ .env created"
            else
              echo "⏭️  .env already exists — skipping"
            fi

            # -------------------------------------------------------
            # 3. Build and restart services
            # -------------------------------------------------------
            cd server
            sudo docker compose up -d --build
            echo "✅ Services restarted"

            # -------------------------------------------------------
            # 4. Cleanup
            # -------------------------------------------------------
            sudo docker image prune -f
            echo "🚀 Deployment complete!"