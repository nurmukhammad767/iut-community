worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    log_format upstream_status '$remote_addr - $request "$status" '
                               'upstream=$upstream_addr '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log upstream_status;

    upstream auth_backend {
        least_conn;
        server backend-1:8000 max_fails=3 fail_timeout=10s;
        server backend-2:8000 max_fails=3 fail_timeout=10s;
    }

    upstream timetable_backend {
        server timetable:8001 max_fails=3 fail_timeout=10s;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Auth & feature routes -> backend replicas
        location /auth/    { proxy_pass http://auth_backend/; include /etc/nginx/proxy.conf; }
        location /clubs    { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /bookings { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /dashboard{ proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /graphql  { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /me       { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /login    { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /register { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /docs     { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }
        location /openapi.json { proxy_pass http://auth_backend; include /etc/nginx/proxy.conf; }

        # WebSocket chat
        location /ws/ {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Timetable service
        location /timetable {
            proxy_pass http://timetable_backend;
            include /etc/nginx/proxy.conf;
        }

        # Gateway health
        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    }
}
