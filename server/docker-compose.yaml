# Centralized Docker Compose — Airflow + FastAPI Backend + MongoDB
# Required .env variables: AIRFLOW_UID, FERNET_KEY, AIRFLOW_PROJ_DIR,
#                          DB_USER, DB_PASSWORD, DB_NAME,
#                          MONGO_USER, MONGO_PASSWORD, MONGO_DB

---
include:
  - observability/docker-compose.yaml

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    _PIP_ADDITIONAL_REQUIREMENTS: 'pymongo==4.17.0 psycopg2-binary==2.9.12 sqlalchemy==2.0.49'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/parsed_data:/opt/airflow/parsed_data
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
  networks:
    - airflow-net
    - backend-net

# ===========================================================================
# NETWORKS
# ===========================================================================
networks:
  backend-net:
    driver: bridge
  airflow-net:
    driver: bridge
  shared-net:
    driver: bridge

# ===========================================================================
# VOLUMES
# ===========================================================================
volumes:
  airflow-db-volume:
  backend-db-volume:
  mongo-db-volume:
  redis-volume:

# ===========================================================================
# SERVICES
# ===========================================================================
# --------------------------------------------------------------------------
# YAML anchor — both backend replicas share this base config.
# --------------------------------------------------------------------------
x-backend-common: &backend-common
  build:
    context: ./
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &backend-env
    DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@backend-postgres:5432/${DB_NAME}
    MONGO_URL: mongodb://mongodb:27017/${MONGO_DB}
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
    OTEL_SERVICE_NAME: iut-auth
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
  command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  volumes:
    - ./auth/main.py:/app/main.py
    - ./auth/jwt.py:/app/jwt.py
    - ./auth/schemas.py:/app/schemas.py
    - ./auth/routers:/app/routers
    - ./auth/ws:/app/ws
    - ./auth/graphql_api:/app/graphql_api
    - ./auth/rate_limiter:/app/rate_limiter
    - ./alembic.ini:/app/alembic.ini
    - ./db:/app/db
    - ./db_config.py:/app/db_config.py
    - ./models.py:/app/models.py
    - ./timetable_web_scraping/parsed_data:/app/parsed_data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s
  depends_on:
    backend-postgres:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
    migration:
      condition: service_completed_successfully
  restart: unless-stopped
  networks:
    - backend-net
    - shared-net

services:

  # --------------------------------------------------------------------------
  # FastAPI Backend replicas (load-balanced behind nginx gateway)
  # --------------------------------------------------------------------------
  backend-1:
    <<: *backend-common
    environment:
      <<: *backend-env
      REPLICA_ID: backend-1

  backend-2:
    <<: *backend-common
    environment:
      <<: *backend-env
      REPLICA_ID: backend-2

  # --------------------------------------------------------------------------
  # Nginx API Gateway (sole public entry point)
  # --------------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/proxy.conf:/etc/nginx/proxy.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      timetable:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
      - shared-net

  # --------------------------------------------------------------------------
  # FastAPI Timetable Service
  # --------------------------------------------------------------------------
  timetable:
    build:
      context: ./time_table_backend
      dockerfile: Dockerfile
    expose:
      - "8001"
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongodb:27017/${MONGO_DB}
      MONGO_DB: ${MONGO_DB}
      REDIS_URL: redis://redis:6379/1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_SERVICE_NAME: iut-timetable
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Redis (cache, rate-limit buckets, chat backlog)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-volume:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # RabbitMQ broker for Celery (lesson reminders, future async work)
  # --------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Celery worker (consumes lesson-reminder tasks)
  # --------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./time_table_backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      MONGO_DB: ${MONGO_DB}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@backend-postgres:5432/${DB_NAME}
      DB_HOST: backend-postgres
      DB_PORT: "5432"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Celery beat (scheduler — fires scan_upcoming_lessons every minute)
  # --------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./time_table_backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      MONGO_DB: ${MONGO_DB}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@backend-postgres:5432/${DB_NAME}
      DB_HOST: backend-postgres
      DB_PORT: "5432"
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery-worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Backend PostgreSQL (FastAPI only)
  # --------------------------------------------------------------------------
  backend-postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - backend-db-volume:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # MongoDB (FastAPI only)
  # --------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_HOST: ${MONGO_HOST}
    volumes:
      - mongo-db-volume:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
  
  # --------------------------------------------------------------------------
  # MongoDB Data Seed (runs once)
  # --------------------------------------------------------------------------
  mongo-seed:
    build:
      context: ./time_table_backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      MONGO_DB: ${MONGO_DB}
    volumes:
      - ./timetable_web_scraping/parsed_data:/app/parsed_data
    command: python data_seed.py
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Alembic Migration (runs once, then exits)
  # --------------------------------------------------------------------------
  migration:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@backend-postgres:5432/${DB_NAME}
      DB_HOST: backend-postgres
      DB_PORT: "5432"
    command: ["bash", "./entrypoint.sh"]
    volumes:
      - ./db:/app/db
      - ./models.py:/app/models.py
      - ./db_config.py:/app/db_config.py
      - ./entrypoint.sh:/app/entrypoint.sh
    working_dir: /app
    depends_on:
      backend-postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Airflow PostgreSQL (Airflow only)
  # --------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - airflow-net

  # --------------------------------------------------------------------------
  # Airflow Init (runs once)
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,parsed_data,scripts}
        /entrypoint airflow version
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    networks:
      - airflow-net

  # --------------------------------------------------------------------------
  # Airflow API Server
  # --------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-net
      - shared-net

  # --------------------------------------------------------------------------
  # Airflow Scheduler
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Airflow DAG Processor
  # --------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Airflow Triggerer
  # --------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully