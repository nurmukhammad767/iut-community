# Centralized Docker Compose — Airflow + FastAPI Backend + MongoDB
# Required .env variables: AIRFLOW_UID, FERNET_KEY, AIRFLOW_PROJ_DIR,
#                          DB_USER, DB_PASSWORD, DB_NAME,
#                          MONGO_USER, MONGO_PASSWORD, MONGO_DB

---
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.1}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/parsed_data:/opt/airflow/parsed_data
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
  networks:
    - airflow-net

# ===========================================================================
# NETWORKS
# ===========================================================================
networks:
  backend-net:
    driver: bridge
  airflow-net:
    driver: bridge
  shared-net:
    driver: bridge

# ===========================================================================
# VOLUMES
# ===========================================================================
volumes:
  airflow-db-volume:
  backend-db-volume:
  mongo-db-volume:

# ===========================================================================
# SERVICES
# ===========================================================================
services:

  # --------------------------------------------------------------------------
  # FastAPI Backend (Auth)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@backend-postgres:5432/${DB_NAME}
      MONGO_URL: mongodb://mongodb:27017/${MONGO_DB}
    volumes:
      - ./auth/main.py:/app/main.py
      - ./auth/jwt.py:/app/jwt.py
      - ./auth/schemas.py:/app/schemas.py
      - ./alembic.ini:/app/alembic.ini
      - ./db:/app/db
      - ./timetable_web_scraping/parsed_data:/app/parsed_data
    depends_on:
      backend-postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend-net
      - shared-net

  # --------------------------------------------------------------------------
  # FastAPI Timetable Service
  # --------------------------------------------------------------------------
  timetable:
    build:
      context: ./time_table_backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongodb:27017/${MONGO_DB}
      MONGO_DB: ${MONGO_DB}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Backend PostgreSQL (FastAPI only)
  # --------------------------------------------------------------------------
  backend-postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - backend-db-volume:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # MongoDB (FastAPI only)
  # --------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_HOST: ${MONGO_HOST}
    volumes:
      - mongo-db-volume:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
  
  # --------------------------------------------------------------------------
  # MongoDB Data Seed (runs once)
  # --------------------------------------------------------------------------
  mongo-seed:
    build:
      context: ./time_table_backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      MONGO_DB: ${MONGO_DB}
    volumes:
      - ./timetable_web_scraping/parsed_data:/app/parsed_data
    command: python data_seed.py
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Alembic Migration (runs once, then exits)
  # --------------------------------------------------------------------------
  migration:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@backend-postgres:5432/${DB_NAME}
      DB_HOST: backend-postgres
      DB_PORT: "5432"
    command: ./entrypoint.sh
    volumes:
      - ./db/versions:/app/db/versions
      - ./models.py:/app/models.py
    working_dir: /app
    depends_on:
      backend-postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-net

  # --------------------------------------------------------------------------
  # Airflow PostgreSQL (Airflow only)
  # --------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - airflow-net

  # --------------------------------------------------------------------------
  # Airflow Init (runs once)
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,parsed_data,scripts}
        /entrypoint airflow version
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    networks:
      - airflow-net

  # --------------------------------------------------------------------------
  # Airflow API Server
  # --------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-net
      - shared-net

  # --------------------------------------------------------------------------
  # Airflow Scheduler
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Airflow DAG Processor
  # --------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Airflow Triggerer
  # --------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully